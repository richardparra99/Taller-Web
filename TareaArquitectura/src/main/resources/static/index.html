<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>To-Do · Arquitectura híbrida</title><style>
:root{font:16px system-ui,sans-serif;color:#e7edf9;background:#0c1220}*{box-sizing:border-box}body{margin:0;padding:28px}main{max-width:800px;margin:30px auto}header{display:flex;justify-content:space-between;align-items:center}h1{margin:0 0 7px;font-size:2rem}p{color:#99a9c4}.chip{padding:8px 14px;background:#183052;border:1px solid #345279;border-radius:99px;font-size:.8rem}.panel{border:1px solid #283751;border-radius:18px;background:#151e2f;padding:20px;margin-top:20px}input,textarea{width:100%;padding:13px;border:1px solid #465676;border-radius:10px;background:#0e1729;color:white;font:inherit;margin:7px 0}textarea{height:75px;resize:vertical}button{border:0;border-radius:9px;padding:10px 14px;background:#538de8;color:#071225;cursor:pointer;font-weight:700}button.secondary{background:#283a55;color:#dce8fb}button.danger{background:#4a2531;color:#ffbfc9}.actions{display:flex;gap:9px;flex-wrap:wrap}.task{display:flex;justify-content:space-between;gap:16px;border-top:1px solid #303d54;padding:17px 0}.task small{color:#9daecb}.done{text-decoration:line-through;color:#96a6bb}.muted{color:#b9c6d9}#notice{min-height:24px;color:#fcbcaf}@media(max-width:550px){body{padding:12px}.task{flex-direction:column}header{display:block}}
</style></head><body><main><header><div><h1>✓ Mis tareas</h1><p>Vertical Slice + Clean Architecture · Spring Boot</p></div><span class="chip" id="counter">Cargando...</span></header><section class="panel"><h2>Crear tarea</h2><form id="form"><input id="title" maxlength="120" required placeholder="Título de la tarea"><textarea id="description" maxlength="1000" placeholder="Descripción opcional"></textarea><button>+ Agregar tarea</button></form></section><section class="panel"><h2>Listado de tareas</h2><div id="notice"></div><div id="tasks"></div></section><p>API disponible en <code>/api/todos</code>. PostgreSQL guarda las tareas.</p></main><script>
const base='/api/todos',items=document.querySelector('#tasks'),notice=document.querySelector('#notice');
async function request(path='',options={}){const r=await fetch(base+path,{headers:{'Content-Type':'application/json'},...options});if(!r.ok){let e;try{e=await r.json()}catch{}throw Error(e?.message||'Error HTTP '+r.status)}return r.status===204?null:r.json()}
function msg(t=''){notice.textContent=t}
async function load(){try{const data=await request();items.replaceChildren();document.querySelector('#counter').textContent=data.filter(x=>x.status==='COMPLETED').length+' / '+data.length+' completadas';if(!data.length){items.textContent='Todavía no tienes tareas.';return}for(const t of data){const row=document.createElement('div');row.className='task';const info=document.createElement('div'),name=document.createElement('strong'),desc=document.createElement('p'),buttons=document.createElement('div');name.textContent=t.title;name.className=t.status==='COMPLETED'?'done':'';desc.textContent=t.description||'Sin descripción';desc.style.margin='5px 0';buttons.className='actions';info.append(name,desc);row.append(info,buttons);const act=(label,fn,cls='secondary')=>{const b=document.createElement('button');b.textContent=label;b.className=cls;b.onclick=async()=>{try{msg();await fn();await load()}catch(e){msg(e.message)}};buttons.append(b)};if(t.status!=='COMPLETED')act('✓ Completar',()=>request('/'+t.id+'/complete',{method:'PATCH'}));act('Editar',async()=>{const title=prompt('Título:',t.title);if(title===null)return;const description=prompt('Descripción:',t.description);if(description===null)return;await request('/'+t.id,{method:'PUT',body:JSON.stringify({title,description})})});act('Eliminar',async()=>{if(confirm('¿Eliminar esta tarea?'))await request('/'+t.id,{method:'DELETE'})},'danger');items.append(row)}}catch(e){msg('No se pudieron cargar las tareas: '+e.message)}}
document.querySelector('#form').onsubmit=async e=>{e.preventDefault();try{msg();await request('',{method:'POST',body:JSON.stringify({title:document.querySelector('#title').value,description:document.querySelector('#description').value})});e.target.reset();await load()}catch(err){msg(err.message)}};load();
</script></body></html>
